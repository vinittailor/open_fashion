version: '3.8'

services:
  # Relational Database Service
  postgres:
    image: postgres:16-alpine
    container_name: open_fashion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: open_fashion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_fashion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Message Broker Service
  redis:
    image: redis:7-alpine
    container_name: open_fashion_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
